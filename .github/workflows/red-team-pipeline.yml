name: Offline Red-Teaming Pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run (generate, feedback, evolve, report)'
        required: true
        type: choice
        options:
          - generate
          - feedback
          - evolve
          - report
      objective:
        description: 'Attack objective (for generate)'
        required: false
        type: string
      campaign:
        description: 'Campaign name (for feedback, evolve, report)'
        required: false
        type: string
      count:
        description: 'Number of candidates (default: 50)'
        required: false
        default: '50'
        type: string
      report_format:
        description: 'Report format (for report: markdown or html)'
        required: false
        default: 'markdown'
        type: choice
        options:
          - markdown
          - html
      ai_mode:
        description: 'Use AI generation mode (--ai)'
        type: boolean
        required: false
        default: false
      ai_provider:
        description: 'AI provider for generation'
        type: choice
        required: false
        default: github
        options:
          - github
          - puter

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .

      - name: Run Generate
        if: inputs.command == 'generate'
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.ai_mode }}" = "true" ]; then
            EXTRA_ARGS="--ai --ai-provider ${{ inputs.ai_provider }}"
          fi
          basilisk generate --objective "${{ inputs.objective }}" --count ${{ inputs.count }} --output-dir generate_output $EXTRA_ARGS

      - name: Run Feedback
        if: inputs.command == 'feedback'
        run: |
          basilisk feedback --input feedback/${{ inputs.campaign }}.csv --campaign ${{ inputs.campaign }}

      - name: Run Evolve
        if: inputs.command == 'evolve'
        run: |
          basilisk evolve-interactive --campaign ${{ inputs.campaign }} --count ${{ inputs.count }} --output-dir generate_output

      - name: Run Report
        if: inputs.command == 'report'
        run: |
          basilisk report --campaign ${{ inputs.campaign }} --format ${{ inputs.report_format }} --output-dir reports

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: red-team-pipeline-artifacts
          path: |
            generate_output/
            reports/
          if-no-files-found: ignore
