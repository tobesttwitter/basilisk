name: Real Scan

on:
  workflow_dispatch:

permissions:
  models: read
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .

      - name: Run Real Scan
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          basilisk scan -t https://basilisk-vulnbot.onrender.com/v1/chat/completions -p github -m gpt-4o-mini --free --report-type executive -o html --output-dir real_scan_output

      - name: Upload Real Scan Output Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-scan-output
          path: real_scan_output/
          if-no-files-found: error
