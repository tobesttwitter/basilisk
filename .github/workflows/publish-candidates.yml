name: Publish Candidates

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions run ID containing candidates to publish'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download candidate artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: red-team-pipeline-artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: download_temp

      - name: Extract generate_output contents to site directory
        run: |
          mkdir -p _site
          CANDIDATE_PATH=$(find download_temp -name candidates.html -type f | head -n 1)
          if [ -z "$CANDIDATE_PATH" ]; then
            echo "Error: candidates.html not found in downloaded artifact."
            exit 1
          fi
          GEN_DIR=$(dirname "$CANDIDATE_PATH")
          cp -r "$GEN_DIR"/* _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
